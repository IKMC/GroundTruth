# CRE workflow settings. Targets are chosen with `--target staging-settings` or CRE_TARGET.
staging-settings:
  user-workflow:
    workflow-name: "field-workflow-staging"
    deployment-registry: "private"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.staging.json"
    secrets-path: ""

production-settings:
  user-workflow:
    workflow-name: "field-workflow-production"
    deployment-registry: "private"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.production.json"
    secrets-path: ""
